<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Game & Account</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      background: #1e293b;
      padding: 25px;
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-secondary {
      background: #475569;
      color: #ffffff;
    }
    .btn-game {
      background: #f59e0b;
      color: #0f172a;
      font-size: 22px;
      padding: 25px;
      border-radius: 50%;
      width: 130px;
      height: 130px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
      user-select: none;
    }
    .btn-game:active {
      transform: scale(0.93);
    }
    .msg {
      margin-top: 12px;
      font-size: 14px;
      min-height: 20px;
    }
    .hidden {
      display: none;
    }
    .info-card {
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: left;
      font-size: 15px;
      line-height: 1.6;
    }
    .score-text {
      font-size: 28px;
      font-weight: bold;
      color: #facc15;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN (Pahile Login Disnar) -->
  <div id="loginBox" class="box">
    <h2>🔐 Account Login</h2>
    <input
      type="text"
      id="loginAcc"
      placeholder="5 Number Account ID (उदा. 12345)"
      maxlength="5"
      inputmode="numeric"
      oninput="this.value = this.value.replace(/[^0-9]/g, '')"
    />
    <input
      type="password"
      id="loginPass"
      placeholder="4 Number Password (उदा. 1234)"
      maxlength="4"
      inputmode="numeric"
      oninput="this.value = this.value.replace(/[^0-9]/g, '')"
    />
    <button class="btn-primary" onclick="loginAccount()">Login Kara</button>
    <button class="btn-secondary" onclick="showCreateScreen()">Create New Account</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- 2. CREATE NEW ACCOUNT SCREEN -->
  <div id="createBox" class="box hidden">
    <h2>✨ Create New Account</h2>
    <input
      type="text"
      id="regName"
      placeholder="Tumche Nav (Name)"
    />
    <input
      type="text"
      id="regAcc"
      placeholder="5 Number Account ID (उदा. 54321)"
      maxlength="5"
      inputmode="numeric"
      oninput="this.value = this.value.replace(/[^0-9]/g, '')"
    />
    <input
      type="password"
      id="regPass"
      placeholder="4 Number Password (उदा. 1234)"
      maxlength="4"
      inputmode="numeric"
      oninput="this.value = this.value.replace(/[^0-9]/g, '')"
    />
    <button class="btn-primary" onclick="createAccount()">Create & Login</button>
    <button class="btn-secondary" onclick="showLoginScreen()">Back to Login</button>
    <div id="createMsg" class="msg"></div>
  </div>

  <!-- 3. SIMPLE GAME SCREEN -->
  <div id="gameBox" class="box hidden">
    <h2>🎮 Simple Tap Game</h2>
    <div class="info-card">
      <div>👤 <b>Name:</b> <span id="playerName">-</span></div>
      <div>🆔 <b>Account ID:</b> <span id="playerAcc">-</span></div>
    </div>

    <div class="score-text">🪙 Coins: <span id="playerCoins">0</span></div>
    <p style="font-size: 13px; color: #94a3b8;">Coin vadhaavnyasathi khalil button var tap kara:</p>

    <button class="btn-game" onclick="tapCoin()">🪙 TAP</button>

    <div id="gameMsg" class="msg" style="color: #4ade80;"></div>
    <button class="btn-secondary" onclick="logout()">Logout</button>
  </div>

  <script>
    let currentUser = null;

    function showCreateScreen() {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("createBox").classList.remove("hidden");
      document.getElementById("loginMsg").innerText = "";
    }

    function showLoginScreen() {
      document.getElementById("createBox").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
      document.getElementById("createMsg").innerText = "";
    }

    // CREATE NEW ACCOUNT FUNCTION (Saves to Firebase)
    async function createAccount() {
      const name = document.getElementById("regName").value.trim();
      const account = document.getElementById("regAcc").value.trim();
      const password = document.getElementById("regPass").value.trim();
      const msgEl = document.getElementById("createMsg");

      if (!name) {
        msgEl.style.color = "#f87171";
        msgEl.innerText = "Krupaya tumche Nav (Name) taka!";
        return;
      }
      if (!/^\d{5}$/.test(account)) {
        msgEl.style.color = "#f87171";
        msgEl.innerText = "Account ID barobar 5 number cha asayla hava!";
        return;
      }
      if (!/^\d{4}$/.test(password)) {
        msgEl.style.color = "#f87171";
        msgEl.innerText = "Password barobar 4 number cha asayla hava!";
        return;
      }

      msgEl.style.color = "#38bdf8";
      msgEl.innerText = "Account banavle jat ahe...";

      try {
        const res = await fetch("/api/bot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "register",
            name: name,
            account: account,
            password: password
          })
        });
        const data = await res.json();

        if (data.status === "success") {
          openGame({
            name: data.user.name,
            account: data.user.account,
            password: password,
            coins: data.user.coins
          });
        } else {
          msgEl.style.color = "#f87171";
          msgEl.innerText = data.message || "Error aala!";
        }
      } catch (err) {
        msgEl.style.color = "#f87171";
        msgEl.innerText = "Server connect hot nahiye, punha prayatna kara!";
      }
    }

    // LOGIN FUNCTION (Checks Firebase)
    async function loginAccount() {
      const account = document.getElementById("loginAcc").value.trim();
      const password = document.getElementById("loginPass").value.trim();
      const msgEl = document.getElementById("loginMsg");

      if (!/^\d{5}$/.test(account)) {
        msgEl.style.color = "#f87171";
        msgEl.innerText = "5 number cha Account ID taka!";
        return;
      }
      if (!/^\d{4}$/.test(password)) {
        msgEl.style.color = "#f87171";
        msgEl.innerText = "4 number cha Password taka!";
        return;
      }

      msgEl.style.color = "#38bdf8";
      msgEl.innerText = "Login hot ahe...";

      try {
        const res = await fetch("/api/bot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "login",
            account: account,
            password: password
          })
        });
        const data = await res.json();

        if (data.status === "success") {
          openGame({
            name: data.user.name,
            account: data.user.account,
            password: password,
            coins: data.user.coins
          });
        } else {
          msgEl.style.color = "#f87171";
          msgEl.innerText = data.message || "Login chukle!";
        }
      } catch (err) {
        msgEl.style.color = "#f87171";
        msgEl.innerText = "Server connect hot nahiye, punha prayatna kara!";
      }
    }

    // OPEN GAME SCREEN
    function openGame(user) {
      currentUser = user;
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("createBox").classList.add("hidden");
      document.getElementById("gameBox").classList.remove("hidden");

      document.getElementById("playerName").innerText = user.name;
      document.getElementById("playerAcc").innerText = user.account;
      document.getElementById("playerCoins").innerText = user.coins;
      document.getElementById("gameMsg").innerText = "Welcome, " + user.name + "!";
    }

    // TAP COIN GAME FUNCTION (Updates Firebase)
    async function tapCoin() {
      if (!currentUser) return;
      currentUser.coins += 1;
      document.getElementById("playerCoins").innerText = currentUser.coins;

      try {
        await fetch("/api/bot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "update_coins",
            account: currentUser.account,
            coins: currentUser.coins
          })
        });
      } catch (e) {}
    }

    // LOGOUT FUNCTION
    function logout() {
      currentUser = null;
      document.getElementById("gameBox").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
      document.getElementById("loginAcc").value = "";
      document.getElementById("loginPass").value = "";
      document.getElementById("loginMsg").innerText = "";
    }
  </script>

</body>
</html>
