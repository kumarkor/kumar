<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumar's Bot Network | Math Hack</title>
    
    <!-- FIREBASE CDNS (Direct HTML Connection) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- MASSIVE CSS STYLING FOR VIP LOOK -->
    <style>
        :root {
            --primary: #00e676;
            --bg-color: #0d1117;
            --box-bg: #161b22;
            --text-color: #c9d1d9;
            --error: #ff4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background-color: var(--box-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #30363d;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #8b949e;
        }
        input {
            width: 100%;
            padding: 15px;
            background-color: #010409;
            border: 1px solid #30363d;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #00c853;
            transform: scale(1.02);
        }
        .error-msg {
            color: var(--error);
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }
        
        /* GAME UI HIDDEN BY DEFAULT */
        #game-section {
            display: none;
        }
        .score-board {
            font-size: 24px;
            margin-bottom: 20px;
            padding: 15px;
            background: #010409;
            border-radius: 8px;
            border: 1px solid var(--primary);
        }
        .math-question {
            font-size: 45px;
            font-weight: bold;
            margin: 30px 0;
            letter-spacing: 5px;
            color: white;
        }
        #feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .logout-btn {
            background-color: var(--error);
            margin-top: 20px;
        }
        .logout-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="container" id="login-section">
        <h1>Bot Network Login</h1>
        <p style="margin-bottom: 25px; color: #8b949e;">Strictly 5-Digit Access ID Required</p>
        
        <div id="login-error" class="error-msg">Error Message Here</div>

        <div class="input-group">
            <label>5-Digit Access ID:</label>
            <input type="text" id="userid" placeholder="e.g. 12345" maxlength="5" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <div class="input-group">
            <label>Secure Password:</label>
            <input type="password" id="password" placeholder="Enter Password">
        </div>
        <button onclick="attemptLogin()" id="login-btn">Authenticate</button>
    </div>

    <!-- MATH GAME SCREEN -->
    <div class="container" id="game-section">
        <h1>System Hacked</h1>
        <div class="score-board">
            Current Score: <span id="display-score" style="color: var(--primary);">0</span>
        </div>
        
        <p>Solve this equation to bypass firewalls:</p>
        <div class="math-question" id="equation">0 + 0 = ?</div>

        <div class="input-group">
            <input type="number" id="math-answer" placeholder="Type your answer...">
        </div>
        <button onclick="checkAnswer()">Submit Answer</button>
        
        <div id="feedback"></div>
        <button class="logout-btn" onclick="logout()">Terminate Session</button>
    </div>

    <!-- THE JAVASCRIPT BRAIN (Firebase + Game Logic) -->
    <script>
        // 1. TUZHI FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDkmoIzcYsYTBYwIk2A_8hUXWW5znyeTaY",
            authDomain: "newkumarbot.firebaseapp.com",
            databaseURL: "https://newkumarbot-default-rtdb.firebaseio.com",
            projectId: "newkumarbot",
            storageBucket: "newkumarbot.firebasestorage.app",
            messagingSenderId: "1006933600404",
            appId: "1:1006933600404:web:1df122474a7598a25fec81"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // System Variables
        let currentUser = null;
        let currentScore = 0;
        let correctAnswer = 0;

        // 2. LOGIN LOGIC (STRICT 5-DIGIT CHECK)
        function attemptLogin() {
            const idInput = document.getElementById("userid").value;
            const passInput = document.getElementById("password").value;
            const errorDiv = document.getElementById("login-error");
            const btn = document.getElementById("login-btn");

            // Strict Validation
            if(idInput.length !== 5) {
                errorDiv.innerText = "❌ ID must be exactly 5 digits!";
                errorDiv.style.display = "block";
                return;
            }
            if(passInput.length < 4) {
                errorDiv.innerText = "❌ Password too short!";
                errorDiv.style.display = "block";
                return;
            }

            errorDiv.style.display = "none";
            btn.innerText = "Connecting...";

            // Check Database
            const userRef = db.ref('players/' + idInput);
            userRef.once('value', (snapshot) => {
                if (snapshot.exists()) {
                    // User Exists - Check Password
                    const data = snapshot.val();
                    if(data.password === passInput) {
                        startGame(idInput, data.score || 0);
                    } else {
                        errorDiv.innerText = "❌ ID already taken! Wrong Password.";
                        errorDiv.style.display = "block";
                        btn.innerText = "Authenticate";
                    }
                } else {
                    // New User - Create Account
                    userRef.set({
                        password: passInput,
                        score: 0,
                        created: new Date().toISOString()
                    }).then(() => {
                        startGame(idInput, 0);
                    });
                }
            });
        }

        // 3. MATH GAME LOGIC
        function startGame(id, score) {
            currentUser = id;
            currentScore = score;
            
            document.getElementById("login-section").style.display = "none";
            document.getElementById("game-section").style.display = "block";
            document.getElementById("display-score").innerText = currentScore;
            
            generateMath();
        }

        function generateMath() {
            const num1 = Math.floor(Math.random() * 50) + 10;
            const num2 = Math.floor(Math.random() * 20) + 1;
            const ops = ['+', '-', '*'];
            const op = ops[Math.floor(Math.random() * ops.length)];

            // Prevent negative answers for minus
            let finalN1 = num1, finalN2 = num2;
            if(op === '-' && num1 < num2) {
                finalN1 = num2; finalN2 = num1;
            }

            document.getElementById("equation").innerText = `${finalN1} ${op} ${finalN2} = ?`;
            
            if(op === '+') correctAnswer = finalN1 + finalN2;
            if(op === '-') correctAnswer = finalN1 - finalN2;
            if(op === '*') correctAnswer = finalN1 * finalN2;
            
            document.getElementById("math-answer").value = "";
            document.getElementById("math-answer").focus();
        }

        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById("math-answer").value);
            const feedback = document.getElementById("feedback");

            if(userAnswer === correctAnswer) {
                currentScore += 10;
                document.getElementById("display-score").innerText = currentScore;
                feedback.innerText = "✅ Correct! +10 Points added to Firebase!";
                feedback.style.color = "#00e676";
                
                // Live Update to Firebase
                db.ref('players/' + currentUser).update({
                    score: currentScore
                });

                setTimeout(() => {
                    feedback.innerText = "";
                    generateMath();
                }, 1000);
            } else {
                feedback.innerText = "❌ Incorrect! Try again.";
                feedback.style.color = "#ff4444";
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById("userid").value = "";
            document.getElementById("password").value = "";
            document.getElementById("login-btn").innerText = "Authenticate";
            
            document.getElementById("game-section").style.display = "none";
            document.getElementById("login-section").style.display = "block";
        }
        
        // Enter key to submit
        document.getElementById("password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { attemptLogin(); }
        });
        document.getElementById("math-answer").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { checkAnswer(); }
        });
    </script>
</body>
</html>
